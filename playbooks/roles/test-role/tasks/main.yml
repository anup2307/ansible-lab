---
- name: Update apt packages
  apt:
    update_cache: yes
- name: Install nginx
  apt:
    name: 
      - nginx
      - curl  
    state: present
- name: Start nginx manually
  shell: nginx || true
- name: ctreate a custom HTML file
  copy: 
    dest: /var/www/html/index.html
    content:
      <h1>Hello from Ansible - {{ inventory_hostname }}</h1>
