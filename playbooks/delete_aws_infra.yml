---
- name: Delete AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    region: us-east-1

  tasks:
    - name: Terminate  EC2 Instance
      amazon.aws.ec2_instance:
        instance_ids:
          - i-04d7c68fc418e31d0
        region: "{{ region }}"
        state: absent
      register: ec2_delete

    - name: Wait for instance termination
      amazon.aws.ec2_instance_info:
        instance_ids:
          - i-04d7c68fc418e31d0
        region: "{{ region }}"
      register: ec2_info
      until: ec2_info.instances[0].state.name=="terminated"
      retries: 10
      delay: 10

    - name: Get VPC info
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "ansible-vpc"
        region: "{{ region }}"
      register: vpc_info

    - name: Delete subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        cidr: 10.0.1.0/24
        region: "{{ region }}"
        state: absent

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        region: "{{ region }}"
        state: absent

    - name: Delete route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        tags:
          Name: ansible-rt
        region: "{{ region }}"
        state: absent

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        name: ansible-vpc
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        region: "{{ region }}"
        state: absent
