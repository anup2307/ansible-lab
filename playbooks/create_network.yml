---
- name: Setup AWS Network
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    region: us-east-1

  tasks:
    - name: Collect VPC Facts
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "ansible-vpc"
        region: "{{ region }}"
      register: vpc_info

    - name: Create Subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        cidr: 10.0.1.0/24
        az: us-east-1a
        region: "{{ region }}"
        state: present
        tags:
          Name: ansible-subnet
      register: subnet_result

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        region: "{{ region }}"
        state: present
      register: igw_result

    - name: Create route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        region: "{{ region }}"
        tags:
          Name: ansible-rt
        subnets:
          - "{{ subnet_result.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw_result.gateway_id }}"
        state: present
